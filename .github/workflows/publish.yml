name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: 门禁：四件套 + 全量测试（含 docker 集成）
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest
      - run: uv build
      - name: 发布至 PyPI
        run: uv publish --token "${{ secrets.PYPI_TOKEN }}"
