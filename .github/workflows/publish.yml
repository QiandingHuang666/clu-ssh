name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要 tag 对象读取注释生成 Release notes
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: 门禁：四件套 + 全量测试（含 docker 集成）
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest
      - name: 幂等检查（版本已在 PyPI 则跳过）
        run: |
          VERSION=$(uv run python -c "import clu; print(clu.__version__)")
          if curl -sf "https://pypi.org/pypi/clu-ssh/${VERSION}/json" >/dev/null; then
            echo "clu-ssh ${VERSION} 已在 PyPI（可能被 yank），跳过发布"
            echo "skip_publish=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: 构建 pty 守护（linux amd64/arm64，嵌入 wheel）
        run: ./daemon-pty/build.sh
      - run: uv build  # 无论是否发布 PyPI 都构建，作为 Release 资产
      - name: 发布至 PyPI
        if: env.skip_publish != 'true'
        run: uv publish --token "${{ secrets.PYPI_TOKEN }}"
      - name: 创建 GitHub Release 并上传发行包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # 通过 API 读 annotated tag 的原始注释（runner 上的本地 tag 可能是轻量化的）
          TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.type)
          NOTES="详见 PyPI 发布"
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha)
            NOTES=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" -q .message)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，仅补充发行包"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "$NOTES"
          fi

  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-13
            target: darwin-x86_64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: uv sync
      - name: 构建 pty 守护（嵌入二进制）
        shell: bash
        run: ./daemon-pty/build.sh
      - name: 构建 clu 单文件二进制
        shell: bash
        run: ./packaging/build_binary.sh dist
      - name: 打包（Unix）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VER=${GITHUB_REF_NAME#v}
          ASSET="clu-${VER}-${{ matrix.target }}.tar.gz"
          cd dist
          tar -czf "$ASSET" clu
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Ver = $env:GITHUB_REF_NAME.TrimStart("v")
          $Asset = "clu-$Ver-${{ matrix.target }}.zip"
          Compress-Archive -Path dist\clu.exe -DestinationPath "dist\$Asset"
          $Hash = (Get-FileHash "dist\$Asset" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Asset" | Out-File "dist\$Asset.sha256" -Encoding ascii
      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip dist/*.sha256)
          [ ${#files[@]} -gt 0 ] || { echo "无产物可上传"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
