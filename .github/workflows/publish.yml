name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: 门禁：四件套 + 全量测试（含 docker 集成）
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest
      - name: 幂等检查（版本已在 PyPI 则跳过）
        run: |
          VERSION=$(uv run python -c "import clu; print(clu.__version__)")
          if curl -sf "https://pypi.org/pypi/clu-ssh/${VERSION}/json" >/dev/null; then
            echo "clu-ssh ${VERSION} 已在 PyPI（可能被 yank），跳过发布"
            echo "skip_publish=true" >> "$GITHUB_ENV"
          fi
      - run: uv build
        if: env.skip_publish != 'true'
      - name: 发布至 PyPI
        if: env.skip_publish != 'true'
        run: uv publish --token "${{ secrets.PYPI_TOKEN }}"
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，跳过"
          else
            NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "${NOTES:-详见 PyPI 发布}" 
          fi
